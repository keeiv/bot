# Use the same installed tools and configuration as CI.
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: python -m black
        language: system
        types: [python]
        files: ^(src|services|tests)/
      - id: isort
        name: isort
        entry: python -m isort
        language: system
        types: [python]
        files: ^(src|services|tests)/
      - id: flake8
        name: flake8
        entry: python -m flake8
        language: system
        types: [python]
        files: ^(src|services|tests)/
      - id: mypy
        name: mypy
        entry: python -m mypy src services
        language: system
        pass_filenames: false
        files: ^(src|services)/.*\.py$
fail_fast: false
